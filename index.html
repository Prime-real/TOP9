    <script>
      // Suppress harmless Vite HMR WebSocket connection failure in proxy/sandbox environment
      window.addEventListener('unhandledrejection', function (e) {
        var msg = (e && e.reason && (e.reason.message || String(e.reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('without opened') !== -1 || msg.indexOf('@vite/client') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        var msg = (e && e.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('without opened') !== -1 || msg.indexOf('@vite/client') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      }, true);
    </script>
